site_name: MFX Documentation
site_description: API documentation for mfx
site_author: LCLS MFX Team
repo_url: https://github.com/pcdshub/mfx
repo_name: pcdshub/mfx
copyright: © 2025 LCLS
theme:
  name: material
  logo: media/logo_2.png
  favicon: media/logo.png
  palette:
  - scheme: slate
    primary: orange
    accent: deep orange
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  - scheme: default
    primary: orange
    accent: deep orange
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.sections
  - navigation.expand
  - navigation.path
  - navigation.indexes
  - navigation.top
  - navigation.tracking
  - search.suggest
  - search.highlight
  - search.share
  - toc.follow
  - toc.integrate
  - content.code.copy
  - content.code.annotate
  - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/flame-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: numpy
          show_source: true
          show_root_heading: true
          show_root_full_path: false
          show_root_toc_entry: true
          show_object_full_path: false
          show_category_heading: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          members_order: alphabetical
          group_by_category: true
          show_if_no_docstring: true
          show_signature: true
          show_signature_annotations: true
          separate_signature: true
          line_length: 80
          merge_init_into_class: true
          docstring_section_style: table
          heading_level: 2
- offline
markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- toc
- pymdownx.arithmatex:
    generic: true
- pymdownx.betterem
- pymdownx.caret
- pymdownx.mark
- pymdownx.tilde
- pymdownx.critic
- pymdownx.details
- pymdownx.emoji
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.smartsymbols
- pymdownx.snippets
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: '!!python/name:pymdownx.superfences.fence_code_format'
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/pcdshub/mfx
  generator: false
extra_css:
- stylesheets/extra.css
