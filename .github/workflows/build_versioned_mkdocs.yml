# MkDocs Build/Deploy for GitHub Pages.
#
# IMPORTANT: Repo Settings -> Pages -> Build and deployment -> Source MUST be
# set to "GitHub Actions" (not "Deploy from a branch"). If Pages source is set
# to a branch instead, GitHub's built-in Jekyll `pages-build-deployment`
# workflow auto-triggers on every push and races this workflow's deploy,
# intermittently serving a raw/Jekyll-rendered README instead of the Material
# mkdocs site. A `.nojekyll` file is kept at the repo root on the
# `documentation` branch (and is also auto-added by `mkdocs gh-deploy` on the
# `gh-pages` branch) as a safety net against this, but the Settings source
# must still be "GitHub Actions" for a reliable, single-pipeline deploy.
name: MkDocs Build
on:
  push:
    branches:
      - documentation
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_mkdocs:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: documentation
          fetch-depth: 1
      # mfx/roadrunner is a git submodule (gitlab.desy.de/fsbmx/janus, public,
      # anonymously cloneable over HTTPS) referenced by docs/mfx/roadrunner/**
      # via mkdocstrings. The default checkout above does not fetch
      # submodules, which previously left mfx/roadrunner/ empty in CI and
      # caused mkdocstrings to fail with "mfx.roadrunner.janus.application
      # could not be found", aborting the whole mkdocs build. Only this
      # submodule is initialized here since it's the only one with doc stubs
      # (mfx/jet_tracking and dev/DropletOnDemand are also submodules but
      # have no doc references, so they're left uninitialized).
      #
      # Several directories inside the upstream janus repo (the submodule
      # root itself, plus mfx/roadrunner/janus/widgets/ui/) have no
      # __init__.py, so griffe (mkdocstrings' Python handler) can't resolve
      # them as proper sub-packages of mfx (regular packages don't
      # implicitly absorb unlisted subdirectories as submodules the way
      # namespace packages do). We can't commit a fix into the submodule
      # itself (it's pinned to an upstream commit via gitlink), so this
      # loop creates an empty __init__.py in every directory under
      # mfx/roadrunner that contains .py files but lacks one, fresh on the
      # runner every build. If upstream janus later adds its own
      # __init__.py files, this loop becomes a harmless no-op for them.
      - name: Init roadrunner submodule
        run: |
          git submodule update --init mfx/roadrunner
          find mfx/roadrunner -type d | while read -r d; do
            if find "$d" -iname "*.py" | grep -q . && [ ! -f "$d/__init__.py" ]; then
              touch "$d/__init__.py"
            fi
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.9
      - run: pip install mkdocs mkdocs-material mkdocstrings "mkdocstrings[python]"
      - run: mkdocs gh-deploy --force

  deploy_mkdocs:
    needs: build_mkdocs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
