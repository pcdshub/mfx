# Jekyll config for GitHub Pages
# safe: true makes Jekyll ignore symlinks (so mfx/ and scripts/ can stay in the build).
# experiments/ and dev/ still excluded (many symlinks to beamline paths).
safe: false
remote_theme: pages-themes/primer@v0.6.0
plugins:
  - jekyll-github-metadata
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - experiments
  - dev