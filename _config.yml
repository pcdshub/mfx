# Jekyll config for GitHub Pages
# In Jekyll 3, exclude replaces the default list, so we keep defaults and add experiments.
# experiments/, dev/, and mfx/roadrunner.sh have symlinks that don't resolve on CI.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - experiments
  - dev
  - mfx/roadrunner.sh
