# Jekyll config for GitHub Pages
# In Jekyll 3, exclude replaces the default list, so we keep defaults and add experiments.
# experiments/ and dev/ excluded (symlinks to beamline paths). Only symlink paths excluded under mfx/ and scripts/.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - experiments
  - dev
  - mfx/roadrunner.sh
  - scripts/awr
