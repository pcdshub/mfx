# Jekyll config for GitHub Pages
# In Jekyll 3, exclude replaces the default list, so we keep defaults and add experiments.
# experiments/, dev/, mfx/, scripts/ have symlinks to beamline paths that don't resolve on CI.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - experiments
  - dev
  - mfx
  - scripts
